<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIKE SEASON 16*29</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="icon" href="assets/favicon.png" type="image/png">
</head>

<body>

    <!-- Custom Cursor -->
    <div class="custom-cursor"></div>

    <!-- Loading State -->
    <div class="modal-overlay active" id="loading-screen">
        <div class="loading-spinner"></div>
    </div>

    <!-- Loading Safety Script -->
    <script>
        const safeHideLoading = () => {
            const loader = document.getElementById('loading-screen');
            if (loader && loader.classList.contains('active')) {
                loader.classList.remove('active');
                setTimeout(() => loader.style.display = 'none', 500);
            }
        };
        // Initial fallback
        setTimeout(safeHideLoading, 3000);
        window.addEventListener('load', safeHideLoading);
    </script>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo-text">SKISEASON</div>
        </div>
        <div class="header-center">
            <video autoplay muted loop playsinline style="height: 60px; pointer-events: none;">
                <source src="assets/logo.mp4" type="video/mp4">
            </video>
        </div>
        <div class="header-right">
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- Side Menu Overlay -->
    <div class="menu-overlay" id="menu-overlay">
        <div class="menu-close" id="menu-close">&times;</div>
        <nav>
            <a href="#" class="menu-item" data-scroll="top">Início</a>
            <a href="comunidade.html" class="menu-item">Comunidade</a>
            <a href="mailto:contato16.29@gmail.com" class="menu-item">Suporte</a>
            <a href="admin.html" class="menu-item" style="margin-top: 40px; font-size: 0.75rem; color: var(--gray-text); letter-spacing: 0.2em;">Admin</a>
        </nav>
    </div>

    <!-- Hero Section -->
    <section class="hero" id="hero">
        <div class="video-wrap">
            <video autoplay muted loop playsinline poster="assets/photo1.jpeg">
                <source src="assets/video.mp4" type="video/mp4">
            </video>
            <div class="video-overlay"></div>
        </div>
        <div class="hero-content">
            <div class="scroll-down" id="scroll-to-swiper">
                Role pra baixo <br> ↓
            </div>
        </div>
    </section>

    <!-- Sweeper Section -->
    <section class="swiper-section" id="collection">
        <div class="container">
            <div class="swiper swiper-container">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"><img src="assets/swipper (1).jpeg" alt="Collection 1"></div>
                    <div class="swiper-slide"><img src="assets/swipper (2).jpeg" alt="Collection 2"></div>
                    <div class="swiper-slide"><img src="assets/swipper (3).jpeg" alt="Collection 3"></div>
                    <div class="swiper-slide"><img src="assets/swipper (4).jpeg" alt="Collection 4"></div>
                    <div class="swiper-slide"><img src="assets/swipper (5).jpeg" alt="Collection 5"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Text Section -->
    <section class="text-banner">
        <div class="container" style="display: flex; flex-direction: column; align-items: center;">
            <h2 class="brand-font">Venha fazer parte de tudo isso.</h2>
            <button class="btn btn-large" onclick="window.location.href='checkout.html'">Comprar Agora</button>
        </div>
    </section>

    <!-- Footer Space -->
    <footer
        style="padding: 40px; text-align: center; color: var(--gray-text); font-size: 0.8rem; border-top: 1px solid var(--gray-border);">
        &copy; 2026 16*29. TODOS OS DIREITOS RESERVADOS.
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
