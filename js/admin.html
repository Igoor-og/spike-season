<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16*29 — Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>emailjs.init("74K-UVW-EQCEZ0BET");</script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #f0f0f0;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: #fff;
        }

        .logo span {
            color: #7B2FBE;
        }

        .subtitle {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #555;
            margin-top: 6px;
        }

        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 32px;
        }

        .card h2 {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #7B2FBE;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
            outline: none;
        }

        .field input:focus {
            border-color: #7B2FBE;
        }

        .field input::placeholder {
            color: #444;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: #7B2FBE;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: #9340e0;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        .feedback.success {
            background: rgba(123, 47, 190, 0.15);
            border: 1px solid #7B2FBE;
            color: #c084fc;
            display: block;
        }

        .feedback.error {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid #dc2626;
            color: #f87171;
            display: block;
        }

        /* Login screen */
        #login-screen {
            display: block;
        }

        #admin-screen {
            display: none;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div class="container" id="login-screen">
        <div class="header">
            <div class="logo">16<span>*</span>29</div>
            <div class="subtitle">Área Administrativa</div>
        </div>
        <div class="card">
            <h2>Acesso restrito</h2>
            <div class="field">
                <label>Senha</label>
                <input type="password" id="senha-input" placeholder="••••••••"
                    onkeydown="if(event.key==='Enter') login()">
            </div>
            <button class="btn" onclick="login()">Entrar</button>
            <div class="feedback" id="login-feedback"></div>
        </div>
    </div>

    <!-- ADMIN -->
    <div class="container" id="admin-screen">
        <div class="header">
            <div class="logo">16<span>*</span>29</div>
            <div class="subtitle">Enviar Rastreio</div>
        </div>
        <div class="card">
            <h2>📦 Código de Rastreio</h2>
            <div class="field">
                <label>Nome do Cliente</label>
                <input type="text" id="cliente-nome" placeholder="Ex: João Silva">
            </div>
            <div class="field">
                <label>E-mail do Cliente</label>
                <input type="email" id="cliente-email" placeholder="cliente@gmail.com">
            </div>
            <div class="field">
                <label>Código de Rastreio</label>
                <input type="text" id="codigo-rastreio" placeholder="Ex: BR123456789BR" style="letter-spacing: 0.1em;">
            </div>
            <button class="btn" id="send-btn" onclick="enviarRastreio()">Enviar E-mail</button>
            <div class="feedback" id="send-feedback"></div>
        </div>
    </div>

    <script>
        const SENHA = "1629admin";

        function login() {
            const val = document.getElementById('senha-input').value;
            const fb = document.getElementById('login-feedback');

            if (val === SENHA) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-screen').style.display = 'block';
            } else {
                fb.className = 'feedback error';
                fb.textContent = 'Senha incorreta.';
            }
        }

        async function enviarRastreio() {
            const nome = document.getElementById('cliente-nome').value.trim();
            const email = document.getElementById('cliente-email').value.trim();
            const rastreio = document.getElementById('codigo-rastreio').value.trim();
            const fb = document.getElementById('send-feedback');
            const btn = document.getElementById('send-btn');

            fb.className = 'feedback';
            fb.textContent = '';

            if (!nome || !email || !rastreio) {
                fb.className = 'feedback error';
                fb.textContent = 'Preencha todos os campos.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Enviando...';

            try {
                await emailjs.send("service_0oibu1g", "template_0nip422", {
                    to_email: email,
                    cliente_nome: nome,
                    codigo_rastreio: rastreio,
                });

                fb.className = 'feedback success';
                fb.textContent = `✅ E-mail enviado para ${email}`;

                document.getElementById('cliente-nome').value = '';
                document.getElementById('cliente-email').value = '';
                document.getElementById('codigo-rastreio').value = '';

            } catch (err) {
                fb.className = 'feedback error';
                fb.textContent = 'Erro ao enviar. Tente novamente.';
                console.error(err);
            }

            btn.disabled = false;
            btn.textContent = 'Enviar E-mail';
        }
    </script>

</body>

</html>
