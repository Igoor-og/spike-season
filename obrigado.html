<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado - Spike Season</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <style>
        .thanks-container {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .thanks-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 30px;
            fill: #9b2cff;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            letter-spacing: 4px;
        }

        p {
            color: #888;
            margin-bottom: 40px;
            max-width: 500px;
        }
    </style>
</head>

<body>
    <header class="header">
        <a href="index.html" class="logo-text">SPIKE SEASON</a>
    </header>

    <main>
        <div class="thanks-container">
            <svg class="thanks-icon" viewBox="0 0 24 24">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
            </svg>
            <h1>OBRIGADO PELA COMPRA!</h1>
            <p>Seu pedido foi recebido e está sendo processado.</p>
            <div class="info-note">
                <p>Fique atento: você será contatado em breve por <strong>e-mail ou whatsapp</strong> com o código de
                    rastreio e atualizações sobre a produção do seu Spike.</p>
            </div>
            <a href="index.html" class="buy-btn">VOLTAR PARA A LOJA</a>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2025 SPIKE SEASON</p>
    </footer>
</body>

</html>
